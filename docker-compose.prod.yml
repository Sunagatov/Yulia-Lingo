version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: yulia-lingo-postgres
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - festiva-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-postgres} -d ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  bot:
    image: zufarexplainedit/yulia-lingo:latest
    container_name: yulia-lingo-bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      POSTGRESQL_HOST: yulia-lingo-postgres
      POSTGRESQL_PORT: 5432
      POSTGRESQL_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE_NAME: ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}
      IRREGULAR_VERBS_FILE_PATH: /resource/nepravilnye-glagoly-295.xlsx
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - festiva-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  postgres-data:

networks:
  festiva-network:
    external: true
