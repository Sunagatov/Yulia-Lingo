services:
  postgres:
    image: postgres:17-alpine
    container_name: yulia-lingo-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-postgres} -d ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  bot:
    profiles: [bot]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yulia-lingo-bot
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRESQL_HOST: postgres
      IRREGULAR_VERBS_FILE_PATH: /resource/nepravilnye-glagoly-295.xlsx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

volumes:
  postgres_data:
