networks:
  yulia-lingo-network:
    name: yulia-lingo-network

volumes:
  postgres-data:

services:

  # ── Infrastructure (always available) ──────────────────────────────────────

  postgres:
    image: postgres:17-alpine
    container_name: yulia-lingo-postgres
    environment:
      POSTGRES_DB: ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}
      POSTGRES_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    ports:
      - "${POSTGRESQL_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - yulia-lingo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USER:-postgres} -d ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Bot (profile: bot) ─────────────────────────────────────────────────────

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yulia-lingo-bot
    profiles: [bot]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      POSTGRESQL_HOST: postgres
      POSTGRESQL_PORT: ${POSTGRESQL_PORT:-5432}
      POSTGRESQL_USER: ${POSTGRESQL_USER:-postgres}
      POSTGRESQL_PASSWORD: ${POSTGRESQL_PASSWORD}
      POSTGRESQL_DATABASE_NAME: ${POSTGRESQL_DATABASE_NAME:-yulia_lingo}
      IRREGULAR_VERBS_FILE_PATH: /resource/nepravilnye-glagoly-295.xlsx
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - yulia-lingo-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
